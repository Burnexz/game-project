<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Kasir POS - SRC Zokent</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: "#eff6ff",
              100: "#dbeafe",
              500: "#2563eb",
              600: "#1d4ed8",
              700: "#1e40af",
              800: "#1e3a8a"
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .number-input::-webkit-inner-spin-button,
    .number-input::-webkit-outer-spin-button {
      opacity: 1;
    }
  </style>
</head>

<body class="bg-slate-100 min-h-screen">

  <!-- HEADER -->
  <header class="bg-brand-700 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-4">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">

        <div>
          <h1 class="text-2xl font-bold">
            SRC Zokent
          </h1>

          <p class="text-blue-100 text-sm">
            Point of Sale / Kasir
          </p>
        </div>

        <div class="bg-white/10 rounded-xl px-4 py-2">
          <div class="text-xs text-blue-100">
            No. Transaksi
          </div>

          <div id="transactionCode"
               class="font-bold tracking-wide">
            -
          </div>
        </div>

      </div>
    </div>
  </header>


  <!-- MAIN -->
  <main class="max-w-7xl mx-auto p-4">

    <!-- NOTIFICATION -->
    <div id="notification"
         class="hidden mb-4 rounded-xl px-4 py-3 text-sm font-medium">
    </div>


    <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">

      <!-- LEFT / CART -->
      <section class="lg:col-span-2">

        <!-- ADD PRODUCT -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 mb-5">

          <div class="flex items-center justify-between mb-4">
            <div>
              <h2 class="font-bold text-lg text-slate-800">
                Tambah Produk
              </h2>

              <p class="text-sm text-slate-500">
                Masukkan informasi produk yang dibeli.
              </p>
            </div>
          </div>


          <form id="productForm"
                class="grid grid-cols-1 sm:grid-cols-12 gap-3">

            <!-- SKU -->
            <div class="sm:col-span-3">
              <label class="block text-sm font-medium text-slate-700 mb-1">
                SKU
              </label>

              <input
                id="productSku"
                type="text"
                placeholder="SKU / kode"
                class="w-full rounded-xl border border-slate-300 px-3 py-2.5 outline-none focus:ring-2 focus:ring-brand-500"
              />
            </div>


            <!-- NAME -->
            <div class="sm:col-span-4">
              <label class="block text-sm font-medium text-slate-700 mb-1">
                Nama Produk
              </label>

              <input
                id="productName"
                type="text"
                placeholder="Nama produk"
                required
                class="w-full rounded-xl border border-slate-300 px-3 py-2.5 outline-none focus:ring-2 focus:ring-brand-500"
              />
            </div>


            <!-- PRICE -->
            <div class="sm:col-span-3">
              <label class="block text-sm font-medium text-slate-700 mb-1">
                Harga
              </label>

              <input
                id="productPrice"
                type="number"
                min="0"
                step="1"
                placeholder="0"
                required
                class="w-full rounded-xl border border-slate-300 px-3 py-2.5 outline-none focus:ring-2 focus:ring-brand-500"
              />
            </div>


            <!-- QTY -->
            <div class="sm:col-span-2">
              <label class="block text-sm font-medium text-slate-700 mb-1">
                Qty
              </label>

              <input
                id="productQty"
                type="number"
                min="1"
                step="1"
                value="1"
                required
                class="number-input w-full rounded-xl border border-slate-300 px-3 py-2.5 outline-none focus:ring-2 focus:ring-brand-500"
              />
            </div>


            <!-- BUTTON -->
            <div class="sm:col-span-12">
              <button
                type="submit"
                class="w-full sm:w-auto bg-brand-600 hover:bg-brand-700 text-white font-semibold px-6 py-3 rounded-xl transition">
                + Tambah ke Keranjang
              </button>
            </div>

          </form>
        </div>


        <!-- CART TABLE -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">

          <div class="p-4 border-b border-slate-200">
            <div class="flex items-center justify-between">

              <div>
                <h2 class="font-bold text-lg text-slate-800">
                  Keranjang Belanja
                </h2>

                <p id="cartInfo"
                   class="text-sm text-slate-500">
                  0 item
                </p>
              </div>

              <button
                id="clearCartButton"
                type="button"
                class="text-sm font-medium text-red-600 hover:text-red-700">
                Kosongkan
              </button>

            </div>
          </div>


          <!-- DESKTOP TABLE -->
          <div class="overflow-x-auto">

            <table class="w-full min-w-[700px]">

              <thead class="bg-slate-50">
                <tr class="text-left text-xs uppercase tracking-wider text-slate-500">

                  <th class="px-4 py-3">
                    Produk
                  </th>

                  <th class="px-4 py-3 text-right">
                    Harga
                  </th>

                  <th class="px-4 py-3 text-center">
                    Qty
                  </th>

                  <th class="px-4 py-3 text-right">
                    Subtotal
                  </th>

                  <th class="px-4 py-3 text-center">
                    Aksi
                  </th>

                </tr>
              </thead>

              <tbody id="cartBody"
                     class="divide-y divide-slate-100">
              </tbody>

            </table>

          </div>


          <!-- EMPTY CART -->
          <div id="emptyCart"
               class="py-16 text-center">

            <div class="text-4xl mb-3">
              🛒
            </div>

            <h3 class="font-semibold text-slate-700">
              Keranjang masih kosong
            </h3>

            <p class="text-sm text-slate-500 mt-1">
              Tambahkan produk untuk memulai transaksi.
            </p>

          </div>

        </div>

      </section>


      <!-- RIGHT / PAYMENT -->
      <aside>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sticky top-4">

          <h2 class="font-bold text-lg text-slate-800 mb-5">
            Ringkasan Pembayaran
          </h2>


          <!-- SUBTOTAL -->
          <div class="flex justify-between text-slate-600 mb-3">
            <span>
              Subtotal
            </span>

            <span id="subtotalDisplay"
                  class="font-semibold text-slate-800">
              Rp0
            </span>
          </div>


          <!-- DISCOUNT -->
          <div class="mb-4">

            <label class="block text-sm font-medium text-slate-700 mb-1">
              Diskon
            </label>

            <input
              id="discountInput"
              type="number"
              min="0"
              value="0"
              class="w-full rounded-xl border border-slate-300 px-3 py-2.5 outline-none focus:ring-2 focus:ring-brand-500"
            />

          </div>


          <!-- TOTAL -->
          <div class="border-t border-slate-200 pt-4 mb-5">

            <div class="flex justify-between items-center">

              <span class="font-bold text-slate-800">
                TOTAL
              </span>

              <span
                id="totalDisplay"
                class="text-2xl font-bold text-brand-700">
                Rp0
              </span>

            </div>

          </div>


          <!-- PAYMENT METHOD -->
          <div class="mb-4">

            <label class="block text-sm font-medium text-slate-700 mb-1">
              Metode Pembayaran
            </label>

            <select
              id="paymentMethod"
              class="w-full rounded-xl border border-slate-300 px-3 py-2.5 bg-white outline-none focus:ring-2 focus:ring-brand-500">

              <option value="cash">
                Tunai
              </option>

              <option value="qris">
                QRIS
              </option>

              <option value="debit">
                Debit
              </option>

              <option value="transfer">
                Transfer
              </option>

            </select>

          </div>


          <!-- PAYMENT -->
          <div class="mb-4">

            <label class="block text-sm font-medium text-slate-700 mb-1">
              Uang Dibayar
            </label>

            <input
              id="paymentInput"
              type="number"
              min="0"
              value="0"
              placeholder="0"
              class="w-full rounded-xl border border-slate-300 px-3 py-3 text-lg font-semibold outline-none focus:ring-2 focus:ring-brand-500"
            />

          </div>


          <!-- CHANGE -->
          <div class="bg-slate-50 rounded-xl p-4 mb-5">

            <div class="flex justify-between">

              <span class="text-slate-600">
                Kembalian
              </span>

              <span
                id="changeDisplay"
                class="font-bold text-green-600">
                Rp0
              </span>

            </div>

          </div>


          <!-- CALCULATE -->
          <button
            id="calculateButton"
            type="button"
            class="w-full border border-brand-600 text-brand-600 hover:bg-brand-50 font-semibold py-3 rounded-xl mb-3 transition">
            Hitung Total
          </button>


          <!-- SAVE -->
          <button
            id="saveTransactionButton"
            type="button"
            class="w-full bg-brand-600 hover:bg-brand-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold py-3.5 rounded-xl transition">

            <span id="saveButtonText">
              Simpan Transaksi
            </span>

          </button>


          <button
            id="newTransactionButton"
            type="button"
            class="hidden w-full mt-3 border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold py-3 rounded-xl">
            Transaksi Baru
          </button>

        </div>

      </aside>

    </div>

  </main>


  <!-- =========================
       JAVASCRIPT
       ========================= -->

  <script>

    /*
     * ==========================================================
     * 1. KONFIGURASI SUPABASE
     * ==========================================================
     *
     * GANTI dua nilai berikut dengan project Supabase Anda.
     *
     * Jangan gunakan service_role key di frontend.
     * Gunakan hanya anon/public key.
     */

    const SUPABASE_URL = "https://YOUR_PROJECT.supabase.co";

    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";


    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


    /*
     * ==========================================================
     * 2. STATE
     * ==========================================================
     */

    let cart = [];


    /*
     * ==========================================================
     * 3. DOM
     * ==========================================================
     */

    const productForm =
      document.getElementById("productForm");

    const productSku =
      document.getElementById("productSku");

    const productName =
      document.getElementById("productName");

    const productPrice =
      document.getElementById("productPrice");

    const productQty =
      document.getElementById("productQty");

    const cartBody =
      document.getElementById("cartBody");

    const emptyCart =
      document.getElementById("emptyCart");

    const cartInfo =
      document.getElementById("cartInfo");

    const subtotalDisplay =
      document.getElementById("subtotalDisplay");

    const totalDisplay =
      document.getElementById("totalDisplay");

    const discountInput =
      document.getElementById("discountInput");

    const paymentInput =
      document.getElementById("paymentInput");

    const changeDisplay =
      document.getElementById("changeDisplay");

    const paymentMethod =
      document.getElementById("paymentMethod");

    const calculateButton =
      document.getElementById("calculateButton");

    const saveTransactionButton =
      document.getElementById("saveTransactionButton");

    const saveButtonText =
      document.getElementById("saveButtonText");

    const clearCartButton =
      document.getElementById("clearCartButton");

    const newTransactionButton =
      document.getElementById("newTransactionButton");

    const notification =
      document.getElementById("notification");

    const transactionCodeElement =
      document.getElementById("transactionCode");


    /*
     * ==========================================================
     * 4. FORMAT RUPIAH
     * ==========================================================
     */

    function formatRupiah(value) {

      const number =
        Number(value) || 0;

      return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
      }).format(number);

    }


    /*
     * ==========================================================
     * 5. GENERATE TRANSACTION CODE
     * ==========================================================
     */

    function generateTransactionCode() {

      const now = new Date();

      const year =
        now.getFullYear();

      const month =
        String(now.getMonth() + 1).padStart(2, "0");

      const day =
        String(now.getDate()).padStart(2, "0");

      const random =
        Math.floor(1000 + Math.random() * 9000);

      return `TRX-${year}${month}${day}-${random}`;

    }


    /*
     * ==========================================================
     * 6. RESET TRANSACTION CODE
     * ==========================================================
     */

    function resetTransactionCode() {

      transactionCodeElement.textContent =
        generateTransactionCode();

    }


    /*
     * ==========================================================
     * 7. NOTIFICATION
     * ==========================================================
     */

    function showNotification(
      message,
      type = "success"
    ) {

      notification.className =
        "mb-4 rounded-xl px-4 py-3 text-sm font-medium";

      if (type === "success") {

        notification.classList.add(
          "bg-green-100",
          "text-green-800",
          "border",
          "border-green-200"
        );

      } else {

        notification.classList.add(
          "bg-red-100",
          "text-red-800",
          "border",
          "border-red-200"
        );

      }

      notification.textContent =
        message;

      notification.classList.remove(
        "hidden"
      );

      setTimeout(() => {

        notification.classList.add(
          "hidden"
        );

      }, 4000);

    }


    /*
     * ==========================================================
     * 8. CALCULATE SUBTOTAL
     * ==========================================================
     */

    function getSubtotal() {

      return cart.reduce(
        (total, item) => {

          return total +
            (item.price * item.qty);

        },
        0
      );

    }


    /*
     * ==========================================================
     * 9. GET DISCOUNT
     * ==========================================================
     */

    function getDiscount() {

      let discount =
        Number(discountInput.value) || 0;

      if (discount < 0) {
        discount = 0;
      }

      return discount;

    }


    /*
     * ==========================================================
     * 10. GET TOTAL
     * ==========================================================
     */

    function getTotal() {

      const subtotal =
        getSubtotal();

      const discount =
        getDiscount();

      return Math.max(
        0,
        subtotal - discount
      );

    }


    /*
     * ==========================================================
     * 11. UPDATE PAYMENT
     * ==========================================================
     */

    function updatePaymentSummary() {

      const subtotal =
        getSubtotal();

      const total =
        getTotal();

      const payment =
        Number(paymentInput.value) || 0;

      const change =
        Math.max(
          0,
          payment - total
        );


      subtotalDisplay.textContent =
        formatRupiah(subtotal);

      totalDisplay.textContent =
        formatRupiah(total);

      changeDisplay.textContent =
        formatRupiah(change);


      if (payment < total && total > 0) {

        changeDisplay.classList.remove(
          "text-green-600"
        );

        changeDisplay.classList.add(
          "text-red-600"
        );

      } else {

        changeDisplay.classList.remove(
          "text-red-600"
        );

        changeDisplay.classList.add(
          "text-green-600"
        );

      }

    }


    /*
     * ==========================================================
     * 12. RENDER CART
     * ==========================================================
     */

    function renderCart() {

      cartBody.innerHTML = "";


      if (cart.length === 0) {

        emptyCart.classList.remove(
          "hidden"
        );

      } else {

        emptyCart.classList.add(
          "hidden"
        );

      }


      const totalQty =
        cart.reduce(
          (sum, item) =>
            sum + item.qty,
          0
        );


      cartInfo.textContent =
        `${totalQty} item`;


      cart.forEach(
        (item, index) => {

          const row =
            document.createElement("tr");

          row.className =
            "hover:bg-slate-50";


          row.innerHTML = `

            <td class="px-4 py-3">

              <div class="font-semibold text-slate-800">
                ${escapeHtml(item.name)}
              </div>

              <div class="text-xs text-slate-500">
                ${escapeHtml(item.sku || "-")}
              </div>

            </td>


            <td class="px-4 py-3 text-right whitespace-nowrap">
              ${formatRupiah(item.price)}
            </td>


            <td class="px-4 py-3">

              <div class="flex items-center justify-center gap-2">

                <button
                  type="button"
                  onclick="changeQty(${index}, -1)"
                  class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 font-bold">
                  −
                </button>

                <input
                  type="number"
                  min="1"
                  value="${item.qty}"
                  onchange="setQty(${index}, this.value)"
                  class="w-16 text-center rounded-lg border border-slate-300 py-1.5"
                />

                <button
                  type="button"
                  onclick="changeQty(${index}, 1)"
                  class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 font-bold">
                  +
                </button>

              </div>

            </td>


            <td class="px-4 py-3 text-right font-semibold whitespace-nowrap">

              ${formatRupiah(
                item.price * item.qty
              )}

            </td>


            <td class="px-4 py-3 text-center">

              <button
                type="button"
                onclick="removeItem(${index})"
                class="text-red-600 hover:text-red-800 font-medium">
                Hapus
              </button>

            </td>

          `;


          cartBody.appendChild(row);

        }
      );


      updatePaymentSummary();

    }


    /*
     * ==========================================================
     * 13. ESCAPE HTML
     * ==========================================================
     */

    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /*
     * ==========================================================
     * 14. ADD PRODUCT
     * ==========================================================
     */

    productForm.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        const sku =
          productSku.value.trim();

        const name =
          productName.value.trim();

        const price =
          Number(productPrice.value);

        const qty =
          Number(productQty.value);


        if (!name) {

          showNotification(
            "Nama produk wajib diisi.",
            "error"
          );

          return;

        }


        if (!Number.isFinite(price) || price < 0) {

          showNotification(
            "Harga produk tidak valid.",
            "error"
          );

          return;

        }


        if (!Number.isInteger(qty) || qty < 1) {

          showNotification(
            "Jumlah produk minimal 1.",
            "error"
          );

          return;

        }


        /*
         * Jika SKU sama, tambahkan qty
         * daripada membuat baris baru.
         */

        const existingIndex =
          cart.findIndex(
            item =>
              item.sku &&
              sku &&
              item.sku === sku
          );


        if (existingIndex !== -1) {

          cart[existingIndex].qty += qty;

        } else {

          cart.push({

            sku,
            name,
            price,
            qty

          });

        }


        productForm.reset();

        productQty.value = 1;

        renderCart();

        productName.focus();

      }
    );


    /*
     * ==========================================================
     * 15. CHANGE QTY
     * ==========================================================
     */

    function changeQty(index, amount) {

      if (!cart[index]) {
        return;
      }


      cart[index].qty += amount;


      if (cart[index].qty <= 0) {

        cart.splice(index, 1);

      }


      renderCart();

    }


    /*
     * ==========================================================
     * 16. SET QTY
     * ==========================================================
     */

    function setQty(index, value) {

      if (!cart[index]) {
        return;
      }


      const qty =
        Number(value);


      if (!Number.isInteger(qty) || qty < 1) {

        cart[index].qty = 1;

      } else {

        cart[index].qty = qty;

      }


      renderCart();

    }


    /*
     * ==========================================================
     * 17. REMOVE ITEM
     * ==========================================================
     */

    function removeItem(index) {

      if (!cart[index]) {
        return;
      }


      const item =
        cart[index];


      const confirmed =
        confirm(
          `Hapus "${item.name}" dari keranjang?`
        );


      if (!confirmed) {
        return;
      }


      cart.splice(index, 1);

      renderCart();

    }


    /*
     * ==========================================================
     * 18. CLEAR CART
     * ==========================================================
     */

    clearCartButton.addEventListener(
      "click",
      function() {

        if (cart.length === 0) {
          return;
        }


        const confirmed =
          confirm(
            "Kosongkan seluruh keranjang?"
          );


        if (!confirmed) {
          return;
        }


        cart = [];

        renderCart();

        paymentInput.value = 0;

        discountInput.value = 0;

        updatePaymentSummary();

      }
    );


    /*
     * ==========================================================
     * 19. AUTO CALCULATE
     * ==========================================================
     */

    discountInput.addEventListener(
      "input",
      updatePaymentSummary
    );


    paymentInput.addEventListener(
      "input",
      updatePaymentSummary
    );


    calculateButton.addEventListener(
      "click",
      function() {

        updatePaymentSummary();

        showNotification(
          "Total pembayaran berhasil dihitung.",
          "success"
        );

      }
    );


    /*
     * ==========================================================
     * 20. SAVE TRANSACTION
     * ==========================================================
     */

    saveTransactionButton.addEventListener(
      "click",
      async function() {

        try {

          /*
           * Validasi keranjang
           */

          if (cart.length === 0) {

            showNotification(
              "Keranjang masih kosong.",
              "error"
            );

            return;

          }


          const subtotal =
            getSubtotal();

          const discount =
            getDiscount();

          const total =
            getTotal();

          const payment =
            Number(paymentInput.value) || 0;


          /*
           * Untuk pembayaran tunai,
           * uang dibayar harus cukup.
           */

          if (
            paymentMethod.value === "cash" &&
            payment < total
          ) {

            showNotification(
              "Uang pembayaran masih kurang.",
              "error"
            );

            paymentInput.focus();

            return;

          }


          /*
           * Untuk non-tunai kita anggap
           * nilai pembayaran sama dengan total.
           */

          const actualPayment =
            paymentMethod.value === "cash"
              ? payment
              : total;


          const change =
            Math.max(
              0,
              actualPayment - total
            );


          /*
           * Disable tombol
           */

          saveTransactionButton.disabled =
            true;

          saveButtonText.textContent =
            "Menyimpan...";


          /*
           * Data transaksi.
           *
           * items akan disimpan sebagai JSONB.
           */

          const transactionData = {

            transaction_code:
              transactionCodeElement.textContent,

            total_amount:
              total,

            payment_amount:
              actualPayment,

            change_amount:
              change,

            items:
              cart.map(item => ({

                sku: item.sku,

                name: item.name,

                price: item.price,

                qty: item.qty,

                subtotal:
                  item.price * item.qty

              })),

            payment_method:
              paymentMethod.value,

            created_at:
              new Date().toISOString()

          };


          /*
           * INSERT SUPABASE
           */

          const {
            data,
            error
          } = await supabaseClient
            .from("transactions")
            .insert(transactionData)
            .select()
            .single();


          if (error) {

            console.error(
              "Supabase error:",
              error
            );

            throw new Error(
              error.message ||
              "Gagal menyimpan transaksi."
            );

          }


          /*
           * Sukses
           */

          console.log(
            "Transaction saved:",
            data
          );


          showNotification(
            `Transaksi ${transactionData.transaction_code} berhasil disimpan.`,
            "success"
          );


          /*
           * Disable form transaksi
           */

          saveTransactionButton.disabled =
            true;

          newTransactionButton.classList.remove(
            "hidden"
          );


        } catch (error) {

          console.error(error);


          showNotification(
            error.message ||
            "Terjadi kesalahan saat menyimpan transaksi.",
            "error"
          );


          saveTransactionButton.disabled =
            false;

          saveButtonText.textContent =
            "Simpan Transaksi";

        }

      }
    );


    /*
     * ==========================================================
     * 21. NEW TRANSACTION
     * ==========================================================
     */

    newTransactionButton.addEventListener(
      "click",
      function() {

        cart = [];

        productForm.reset();

        productQty.value = 1;

        discountInput.value = 0;

        paymentInput.value = 0;

        paymentMethod.value = "cash";


        resetTransactionCode();

        renderCart();


        saveTransactionButton.disabled =
          false;

        saveButtonText.textContent =
          "Simpan Transaksi";


        newTransactionButton.classList.add(
          "hidden"
        );


        updatePaymentSummary();


        productName.focus();

      }
    );


    /*
     * ==========================================================
     * 22. INITIALIZE
     * ==========================================================
     */

    resetTransactionCode();

    renderCart();

    updatePaymentSummary();

  </script>

</body>
</html>
