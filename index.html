<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kasir POS - src zokent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } }
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .sheet { transition: transform .3s ease; }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased">

  <div class="flex h-screen flex-col lg:flex-row overflow-hidden">

    <!-- ================= KOLOM KIRI: PRODUK (60%) ================= -->
    <main class="flex h-full w-full flex-col lg:w-3/5">
      <!-- Header -->
      <header class="bg-white px-4 pt-4 pb-3 shadow-sm sm:px-6">
        <div class="flex items-center justify-between gap-3">
          <div class="flex items-center gap-3">
            <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-600 text-lg font-extrabold text-white">S</div>
            <div>
              <h1 class="text-base font-bold leading-tight">src zokent</h1>
              <p class="text-xs text-slate-500" id="tanggal"></p>
            </div>
          </div>
          <div class="relative w-full max-w-xs">
            <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="cari" type="text" placeholder="Cari produk..." class="w-full rounded-xl border border-slate-200 bg-slate-50 py-2 pl-9 pr-3 text-sm outline-none focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-100" />
          </div>
        </div>
        <!-- Filter kategori -->
        <div id="kategori" class="no-scrollbar -mx-1 mt-3 flex gap-2 overflow-x-auto px-1 pb-1"></div>
      </header>

      <!-- Grid produk -->
      <section class="flex-1 overflow-y-auto p-4 pb-28 sm:p-6 lg:pb-6">
        <div id="grid" class="grid grid-cols-2 gap-3 sm:grid-cols-3 sm:gap-4 xl:grid-cols-4"></div>
        <p id="kosong" class="hidden py-20 text-center text-slate-400">Produk tidak ditemukan.</p>
      </section>
    </main>

    <!-- ================= KOLOM KANAN: KERANJANG (40%) ================= -->
    <!-- Desktop: panel tetap. Mobile: bottom sheet -->
    <aside id="panel" class="sheet fixed inset-x-0 bottom-0 z-30 flex h-[88vh] translate-y-full flex-col rounded-t-3xl bg-white shadow-2xl lg:static lg:z-auto lg:h-full lg:w-2/5 lg:translate-y-0 lg:rounded-none lg:border-l lg:border-slate-200 lg:shadow-none">
      <div class="flex items-center justify-between border-b border-slate-100 px-5 py-4">
        <div>
          <h2 class="text-lg font-bold">Keranjang</h2>
          <p class="text-xs text-slate-500"><span id="jmlItem">0</span> item</p>
        </div>
        <div class="flex items-center gap-2">
          <button id="kosongkan" class="rounded-lg px-3 py-1.5 text-xs font-medium text-rose-600 hover:bg-rose-50">Kosongkan</button>
          <button id="tutupPanel" class="rounded-lg p-2 text-slate-500 hover:bg-slate-100 lg:hidden" aria-label="Tutup">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </div>

      <!-- Daftar item -->
      <div id="items" class="flex-1 space-y-3 overflow-y-auto px-5 py-4"></div>

      <!-- Ringkasan -->
      <div class="border-t border-slate-100 bg-slate-50 px-5 pt-4 pb-5">
        <div class="space-y-2 text-sm">
          <div class="flex justify-between"><span class="text-slate-500">Subtotal</span><span id="subtotal" class="font-medium">Rp 0</span></div>
          <div class="flex items-center justify-between">
            <span class="flex items-center gap-2 text-slate-500">Diskon
              <span class="relative">
                <input id="diskonPersen" type="number" min="0" max="100" value="0" class="w-16 rounded-lg border border-slate-200 bg-white py-1 pl-2 pr-6 text-right text-xs outline-none focus:border-indigo-500" />
                <span class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-xs text-slate-400">%</span>
              </span>
            </span>
            <span id="diskon" class="font-medium text-emerald-600">- Rp 0</span>
          </div>
          <div class="flex justify-between"><span class="text-slate-500">Pajak (PPN 11%)</span><span id="pajak" class="font-medium">Rp 0</span></div>
        </div>
        <div class="my-3 border-t border-dashed border-slate-300"></div>
        <div class="mb-4 flex items-end justify-between">
          <span class="text-sm font-medium text-slate-500">Total</span>
          <span id="total" class="text-3xl font-extrabold tracking-tight text-indigo-600">Rp 0</span>
        </div>
        <button id="bayar" class="w-full rounded-2xl bg-indigo-600 py-4 text-lg font-bold text-white shadow-lg shadow-indigo-200 transition hover:bg-indigo-700 active:scale-[.99] disabled:cursor-not-allowed disabled:bg-slate-300 disabled:shadow-none" disabled>Bayar</button>
      </div>
    </aside>
  </div>

  <!-- Tombol keranjang melayang (mobile) -->
  <button id="bukaPanel" class="fixed inset-x-4 bottom-4 z-20 flex items-center justify-between rounded-2xl bg-indigo-600 px-5 py-4 text-white shadow-xl lg:hidden">
    <span class="flex items-center gap-2 font-semibold">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
      Keranjang (<span id="jmlItemFab">0</span>)
    </span>
    <span id="totalFab" class="font-bold">Rp 0</span>
  </button>
  <div id="overlay" class="fixed inset-0 z-20 hidden bg-slate-900/40 lg:hidden"></div>

  <!-- ================= MODAL PEMBAYARAN ================= -->
  <div id="modal" class="fixed inset-0 z-40 hidden items-center justify-center bg-slate-900/50 p-4">
    <div class="w-full max-w-md rounded-3xl bg-white p-6 shadow-2xl">
      <h3 class="text-xl font-bold">Pembayaran</h3>
      <p class="mt-1 text-sm text-slate-500">Total tagihan</p>
      <p id="mTotal" class="text-3xl font-extrabold text-indigo-600">Rp 0</p>

      <label class="mt-5 block text-sm font-medium text-slate-600">Uang diterima</label>
      <input id="uang" type="number" inputmode="numeric" placeholder="0" class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-3 text-lg font-semibold outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" />
      <div id="cepat" class="mt-3 flex flex-wrap gap-2"></div>

      <div class="mt-5 flex items-center justify-between rounded-xl bg-slate-50 px-4 py-3">
        <span class="text-sm text-slate-500">Kembalian</span>
        <span id="kembalian" class="text-lg font-bold text-emerald-600">Rp 0</span>
      </div>

      <div class="mt-6 grid grid-cols-2 gap-3">
        <button id="batal" class="rounded-xl border border-slate-200 py-3 font-semibold text-slate-600 hover:bg-slate-50">Batal</button>
        <button id="konfirmasi" class="rounded-xl bg-indigo-600 py-3 font-semibold text-white hover:bg-indigo-700 disabled:bg-slate-300" disabled>Selesaikan</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="pointer-events-none fixed left-1/2 top-4 z-50 -translate-x-1/2 -translate-y-20 rounded-xl bg-slate-900 px-5 py-3 text-sm font-medium text-white opacity-0 shadow-lg transition-all duration-300"></div>

<script>
  // ---------- DATA PRODUK ----------
  // Isi "img" dengan URL gambar produk. Jika kosong, ditampilkan emoji sebagai placeholder.
  const PRODUK = [
    { id: 1,  nama: 'Kopi Susu Gula Aren', harga: 18000, kategori: 'Minuman',  emoji: '🥤', img: '' },
    { id: 2,  nama: 'Es Teh Manis',        harga: 8000,  kategori: 'Minuman',  emoji: '🧋', img: '' },
    { id: 3,  nama: 'Air Mineral 600ml',   harga: 5000,  kategori: 'Minuman',  emoji: '💧', img: '' },
    { id: 4,  nama: 'Jus Jeruk',           harga: 14000, kategori: 'Minuman',  emoji: '🍊', img: '' },
    { id: 5,  nama: 'Nasi Goreng Spesial', harga: 25000, kategori: 'Makanan',  emoji: '🍛', img: '' },
    { id: 6,  nama: 'Mie Ayam Bakso',      harga: 22000, kategori: 'Makanan',  emoji: '🍜', img: '' },
    { id: 7,  nama: 'Ayam Geprek',         harga: 23000, kategori: 'Makanan',  emoji: '🍗', img: '' },
    { id: 8,  nama: 'Roti Bakar Coklat',   harga: 15000, kategori: 'Snack',    emoji: '🍞', img: '' },
    { id: 9,  nama: 'Kentang Goreng',      harga: 16000, kategori: 'Snack',    emoji: '🍟', img: '' },
    { id: 10, nama: 'Keripik Singkong',    harga: 10000, kategori: 'Snack',    emoji: '🥔', img: '' },
    { id: 11, nama: 'Brownies Coklat',     harga: 12000, kategori: 'Dessert',  emoji: '🍫', img: '' },
    { id: 12, nama: 'Es Krim Vanilla',     harga: 11000, kategori: 'Dessert',  emoji: '🍨', img: '' },
  ];
  const PPN = 0.11;
  const WARNA = ['bg-amber-100','bg-sky-100','bg-rose-100','bg-emerald-100','bg-violet-100','bg-orange-100'];

  // ---------- STATE ----------
  let kategoriAktif = 'Semua';
  let kataCari = '';
  let keranjang = {};   // { id: qty }
  let diskonPersen = 0;

  const rp = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');
  const $ = id => document.getElementById(id);

  // ---------- RENDER KATEGORI ----------
  function renderKategori() {
    const daftar = ['Semua', ...new Set(PRODUK.map(p => p.kategori))];
    $('kategori').innerHTML = daftar.map(k => `
      <button data-k="${k}" class="shrink-0 rounded-full px-4 py-1.5 text-sm font-medium transition ${
        k === kategoriAktif ? 'bg-indigo-600 text-white shadow' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
      }">${k}</button>`).join('');
  }

  // ---------- RENDER PRODUK ----------
  function renderGrid() {
    const hasil = PRODUK.filter(p =>
      (kategoriAktif === 'Semua' || p.kategori === kategoriAktif) &&
      p.nama.toLowerCase().includes(kataCari.toLowerCase())
    );
    $('kosong').classList.toggle('hidden', hasil.length > 0);
    $('grid').innerHTML = hasil.map(p => `
      <div class="group flex flex-col overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-slate-100 transition hover:shadow-md">
        <div class="relative flex aspect-[4/3] items-center justify-center ${WARNA[p.id % WARNA.length]}">
          ${p.img
            ? `<img src="${p.img}" alt="${p.nama}" class="h-full w-full object-cover" loading="lazy" />`
            : `<span class="text-5xl transition group-hover:scale-110">${p.emoji}</span>`}
          ${keranjang[p.id] ? `<span class="absolute right-2 top-2 rounded-full bg-indigo-600 px-2 py-0.5 text-xs font-bold text-white">${keranjang[p.id]}</span>` : ''}
        </div>
        <div class="flex flex-1 flex-col p-3">
          <h3 class="line-clamp-2 text-sm font-semibold leading-snug">${p.nama}</h3>
          <p class="mt-1 text-sm font-bold text-indigo-600">${rp(p.harga)}</p>
          <button data-add="${p.id}" class="mt-3 rounded-xl bg-indigo-50 py-2 text-sm font-semibold text-indigo-700 transition hover:bg-indigo-600 hover:text-white active:scale-95">+ Tambah</button>
        </div>
      </div>`).join('');
  }

  // ---------- RENDER KERANJANG ----------
  function hitung() {
    const subtotal = Object.entries(keranjang).reduce((s, [id, q]) => s + PRODUK.find(p => p.id == id).harga * q, 0);
    const diskon = subtotal * (diskonPersen / 100);
    const pajak = (subtotal - diskon) * PPN;
    const total = subtotal - diskon + pajak;
    const jumlah = Object.values(keranjang).reduce((a, b) => a + b, 0);
    return { subtotal, diskon, pajak, total, jumlah };
  }

  function renderKeranjang() {
    const ids = Object.keys(keranjang);
    $('items').innerHTML = ids.length === 0
      ? `<div class="flex h-full flex-col items-center justify-center text-center text-slate-400">
           <div class="text-5xl">🛒</div><p class="mt-2 font-medium">Keranjang masih kosong</p><p class="text-xs">Pilih produk untuk memulai transaksi</p></div>`
      : ids.map(id => {
          const p = PRODUK.find(x => x.id == id), q = keranjang[id];
          return `
          <div class="flex items-center gap-3 rounded-2xl border border-slate-100 p-3">
            <div class="flex h-12 w-12 shrink-0 items-center justify-center overflow-hidden rounded-xl ${WARNA[p.id % WARNA.length]} text-2xl">
              ${p.img ? `<img src="${p.img}" class="h-full w-full object-cover" alt="">` : p.emoji}
            </div>
            <div class="min-w-0 flex-1">
              <p class="truncate text-sm font-semibold">${p.nama}</p>
              <p class="text-xs text-slate-500">${rp(p.harga)}</p>
              <p class="mt-0.5 text-sm font-bold">${rp(p.harga * q)}</p>
            </div>
            <div class="flex items-center gap-1 rounded-xl bg-slate-100 p-1">
              <button data-min="${id}" class="flex h-7 w-7 items-center justify-center rounded-lg bg-white text-lg font-bold shadow-sm hover:bg-rose-50 hover:text-rose-600">−</button>
              <span class="w-6 text-center text-sm font-semibold">${q}</span>
              <button data-plus="${id}" class="flex h-7 w-7 items-center justify-center rounded-lg bg-white text-lg font-bold shadow-sm hover:bg-indigo-50 hover:text-indigo-600">+</button>
            </div>
          </div>`;
        }).join('');

    const h = hitung();
    $('subtotal').textContent = rp(h.subtotal);
    $('diskon').textContent = '- ' + rp(h.diskon);
    $('pajak').textContent = rp(h.pajak);
    $('total').textContent = rp(h.total);
    $('totalFab').textContent = rp(h.total);
    $('jmlItem').textContent = h.jumlah;
    $('jmlItemFab').textContent = h.jumlah;
    $('bayar').disabled = h.jumlah === 0;
    $('bayar').textContent = h.jumlah ? `Bayar ${rp(h.total)}` : 'Bayar';
  }

  function refresh() { renderGrid(); renderKeranjang(); }

  // ---------- AKSI ----------
  function ubahQty(id, delta) {
    keranjang[id] = (keranjang[id] || 0) + delta;
    if (keranjang[id] <= 0) delete keranjang[id];
    refresh();
  }

  $('grid').addEventListener('click', e => {
    const b = e.target.closest('[data-add]'); if (b) ubahQty(b.dataset.add, 1);
  });
  $('items').addEventListener('click', e => {
    const a = e.target.closest('[data-plus]'), m = e.target.closest('[data-min]');
    if (a) ubahQty(a.dataset.plus, 1);
    if (m) ubahQty(m.dataset.min, -1);
  });
  $('kategori').addEventListener('click', e => {
    const b = e.target.closest('[data-k]'); if (!b) return;
    kategoriAktif = b.dataset.k; renderKategori(); renderGrid();
  });
  $('cari').addEventListener('input', e => { kataCari = e.target.value; renderGrid(); });
  $('diskonPersen').addEventListener('input', e => {
    diskonPersen = Math.min(100, Math.max(0, parseFloat(e.target.value) || 0)); renderKeranjang();
  });
  $('kosongkan').addEventListener('click', () => { keranjang = {}; refresh(); });

  // Bottom sheet (mobile)
  const bukaPanel = () => { $('panel').classList.remove('translate-y-full'); $('overlay').classList.remove('hidden'); };
  const tutupPanel = () => { $('panel').classList.add('translate-y-full'); $('overlay').classList.add('hidden'); };
  $('bukaPanel').addEventListener('click', bukaPanel);
  $('tutupPanel').addEventListener('click', tutupPanel);
  $('overlay').addEventListener('click', tutupPanel);

  // ---------- PEMBAYARAN ----------
  function updateKembalian() {
    const { total } = hitung();
    const uang = parseFloat($('uang').value) || 0;
    const kembali = uang - Math.round(total);
    $('kembalian').textContent = rp(Math.max(0, kembali));
    $('kembalian').className = 'text-lg font-bold ' + (kembali >= 0 ? 'text-emerald-600' : 'text-rose-600');
    $('konfirmasi').disabled = uang < Math.round(total);
  }

  $('bayar').addEventListener('click', () => {
    const { total } = hitung();
    const t = Math.round(total);
    $('mTotal').textContent = rp(t);
    $('uang').value = '';
    const opsi = [...new Set([t, Math.ceil(t / 10000) * 10000, Math.ceil(t / 50000) * 50000, Math.ceil(t / 100000) * 100000])];
    $('cepat').innerHTML = opsi.map(n => `<button data-uang="${n}" class="rounded-lg bg-slate-100 px-3 py-1.5 text-sm font-medium hover:bg-indigo-100 hover:text-indigo-700">${n === t ? 'Uang pas' : rp(n)}</button>`).join('');
    updateKembalian();
    $('modal').classList.replace('hidden', 'flex');
    setTimeout(() => $('uang').focus(), 50);
  });
  $('cepat').addEventListener('click', e => {
    const b = e.target.closest('[data-uang]'); if (!b) return;
    $('uang').value = b.dataset.uang; updateKembalian();
  });
  $('uang').addEventListener('input', updateKembalian);
  $('batal').addEventListener('click', () => $('modal').classList.replace('flex', 'hidden'));
  $('konfirmasi').addEventListener('click', () => {
    $('modal').classList.replace('flex', 'hidden');
    keranjang = {}; diskonPersen = 0; $('diskonPersen').value = 0;
    refresh(); tutupPanel();
    toast('✅ Transaksi berhasil disimpan');
  });

  function toast(msg) {
    const t = $('toast'); t.textContent = msg;
    t.classList.remove('-translate-y-20', 'opacity-0');
    setTimeout(() => t.classList.add('-translate-y-20', 'opacity-0'), 2200);
  }

  // ---------- INIT ----------
  $('tanggal').textContent = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  renderKategori();
  refresh();
</script>
</body>
</html>
