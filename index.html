<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahjong Ways Style Game</title>
    <style>
        body {
            background: linear-gradient(135deg, #0b4f26, #02230f);
            color: #ffd700;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(0, 0, 0, 0.6);
            border: 4px solid #ffd700;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px #000;
            letter-spacing: 1px;
        }
        .slot-container {
            font-size: 50px;
            background: #111;
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border: 2px solid #daa520;
        }
        .slot-box {
            background: #fff;
            color: #000;
            padding: 5px 15px;
            border-radius: 8px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        button {
            background: linear-gradient(to bottom, #ffd700, #ff8c00);
            color: #000;
            border: none;
            padding: 14px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.2s;
            width: 100%;
        }
        button:active {
            transform: scale(0.95);
            background: linear-gradient(to bottom, #e6c200, #e07b00);
        }
        .info {
            margin-top: 15px;
            font-size: 16px;
            color: #fff;
        }
        #result {
            font-size: 20px;
            margin-top: 15px;
            font-weight: bold;
            min-height: 30px;
        }
        .win {
            color: #00ff00;
            text-shadow: 0 0 10px rgba(0,255,0,0.5);
        }
        .lose {
            color: #ff4d4d;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MAHJONG WAYS</h1>
        <div class="info">Saldo: <span id="balance" style="color: #ffd700; font-weight: bold;">1000</span> Koin</div>
        
        <div class="slot-container">
            <div class="slot-box" id="slot1">🀄</div>
            <div class="slot-box" id="slot2">🀅</div>
            <div class="slot-box" id="slot3">🀄</div>
        </div>

        <button onclick="spinGame()">PUTAR (SPIN)</button>
        <div id="result"></div>
    </div>

    <script>
        // Simbol ubin Mahjong khas
        const symbols = ['🀄', '🀅', '🀇', '🀙', '🀐', '🀀'];
        let balance = 1000;

        function spinGame() {
            if (balance < 50) {
                document.getElementById('result').innerText = "Saldo habis!";
                document.getElementById('result').className = "lose";
                return;
            }

            balance -= 50; // Biaya per spin
            document.getElementById('balance').innerText = balance;

            // Efek acak simbol
            const s1 = symbols[Math.floor(Math.random() * symbols.length)];
            const s2 = symbols[Math.floor(Math.random() * symbols.length)];
            const s3 = symbols[Math.floor(Math.random() * symbols.length)];

            document.getElementById('slot1').innerText = s1;
            document.getElementById('slot2').innerText = s2;
            document.getElementById('slot3').innerText = s3;

            const resultEl = document.getElementById('result');

            // Cek kondisi menang (jika 3 simbol sama atau ada simbol Naga Merah 🀄 kembar)
            if (s1 === s2 && s2 === s3) {
                let prize = s1 === '🀄' ? 500 : 200; // Naga merah hadiah lebih besar
                balance += prize;
                resultEl.innerText = `🎉 JACKPOT! Menang ${prize} Koin! 🎉`;
                resultEl.className = "win";
            } else if (s1 === s2 || s2 === s3 || s1 === s3) {
                balance += 100;
                resultEl.innerText = "✨ Lumayan! Menang 100 Koin ✨";
                resultEl.className = "win";
            } else {
                resultEl.innerText = "Coba lagi, Keberuntungan menanti!";
                resultEl.className = "lose";
            }

            document.getElementById('balance').innerText = balance;
        }
    </script>

</body>
</html>
