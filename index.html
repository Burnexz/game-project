<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mahjong Ways</title>
    <style>
        body {
            background: linear-gradient(135deg, #0b4f26, #02230f);
            color: #ffd700;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(0, 0, 0, 0.7);
            border: 4px solid #ffd700;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
            max-width: 380px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px #000;
            letter-spacing: 1px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            font-size: 14px;
            color: #fff;
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border-radius: 8px;
            border: 2px solid #daa520;
            background: #111;
            color: #fff;
            font-size: 16px;
        }
        button {
            background: linear-gradient(to bottom, #ffd700, #ff8c00);
            color: #000;
            border: none;
            padding: 14px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 100%;
            margin-top: 10px;
            transition: 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        /* Style untuk Game Screen */
        #game-screen {
            display: none;
        }
        .slot-container {
            font-size: 50px;
            background: #111;
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border: 2px solid #daa520;
        }
        .slot-box {
            background: #fff;
            color: #000;
            padding: 5px 15px;
            border-radius: 8px;
        }
        .info {
            margin-top: 10px;
            font-size: 15px;
            color: #fff;
        }
        #result {
            font-size: 18px;
            margin-top: 15px;
            font-weight: bold;
            min-height: 25px;
        }
        .win { color: #00ff00; text-shadow: 0 0 10px rgba(0,255,0,0.5); }
        .lose { color: #ff4d4d; }
    </style>
</head>
<body>

    <!-- HALAMAN LOGIN -->
    <div class="container" id="login-screen">
        <h1>MAHJONG WAYS LOGIN</h1>
        <div class="input-group">
            <label>Username / ID:</label>
            <input type="text" id="usernameInput" placeholder="Masukkan username Anda...">
        </div>
        <div class="input-group">
            <label>Password:</label>
            <input type="password" id="passwordInput" placeholder="Masukkan password...">
        </div>
        <button onclick="handleLogin()">MASUK (LOGIN)</button>
    </div>

    <!-- HALAMAN GAME (Awalnya Disembunyikan) -->
    <div class="container" id="game-screen">
        <h1>MAHJONG WAYS</h1>
        <div class="info">User: <span id="displayUser" style="color: #ffd700; font-weight: bold;"></span></div>
        <div class="info">Saldo: <span id="balance" style="color: #ffd700; font-weight: bold;">1000</span> Koin</div>
        
        <div class="slot-container">
            <div class="slot-box" id="slot1">🀄</div>
            <div class="slot-box" id="slot2">🀅</div>
            <div class="slot-box" id="slot3">🀄</div>
        </div>

        <button onclick="spinGame()">PUTAR (SPIN)</button>
        <div id="result"></div>
        <button onclick="handleLogout()" style="background: #444; color: #fff; font-size: 14px; padding: 8px; margin-top: 15px;">Keluar (Logout)</button>
    </div>

    <script>
        let balance = 1000;
        const symbols = ['🀄', '🀅', '🀇', '🀙', '🀐', '🀀'];

        function handleLogin() {
            const username = document.getElementById('usernameInput').value.trim();
            if (username === "") {
                alert("Silakan masukkan username terlebih dahulu!");
                return;
            }
            // Sembunyikan login, tampilkan game
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('displayUser').innerText = username;
        }

        function handleLogout() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'block';
            document.getElementById('usernameInput').value = "";
            document.getElementById('passwordInput').value = "";
        }

        function spinGame() {
            if (balance < 50) {
                document.getElementById('result').innerText = "Saldo habis!";
                document.getElementById('result').className = "lose";
                return;
            }

            balance -= 50;
            document.getElementById('balance').innerText = balance;

            const s1 = symbols[Math.floor(Math.random() * symbols.length)];
            const s2 = symbols[Math.floor(Math.random() * symbols.length)];
            const s3 = symbols[Math.floor(Math.random() * symbols.length)];

            document.getElementById('slot1').innerText = s1;
            document.getElementById('slot2').innerText = s2;
            document.getElementById('slot3').innerText = s3;

            const resultEl = document.getElementById('result');

            if (s1 === s2 && s2 === s3) {
                let prize = s1 === '🀄' ? 500 : 200;
                balance += prize;
                resultEl.innerText = `🎉 JACKPOT! Menang ${prize} Koin! 🎉`;
                resultEl.className = "win";
            } else if (s1 === s2 || s2 === s3 || s1 === s3) {
                balance += 100;
                resultEl.innerText = "✨ Lumayan! Menang 100 Koin ✨";
                resultEl.className = "win";
            } else {
                resultEl.innerText = "Coba lagi, Keberuntungan menanti!";
                resultEl.className = "lose";
            }

            document.getElementById('balance').innerText = balance;
        }
    </script>

</body>
</html>
