<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BURNEXZTOTO - Situs Resmi Terpercaya</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-container {
            width: 100%;
            max-width: 400px;
            background-color: #121622;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 2px solid #2a3447;
        }

        /* Browser Address Bar */
        .browser-bar {
            background-color: #1a2233;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #b0bec5;
            border-bottom: 1px solid #2a3447;
        }

        .url-box {
            background: #0b0f19;
            padding: 5px 15px;
            border-radius: 15px;
            flex-grow: 1;
            margin: 0 10px;
            text-align: center;
            color: #ffffff;
        }

        /* Header / Navbar Atas */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background-color: #121622;
            border-bottom: 1px solid #2a3447;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .logo span {
            color: #1e90ff;
        }

        .btn-bergabung {
            background-color: #1e90ff;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Banner Section */
        .banner {
            position: relative;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #1e90ff;
        }

        .banner-text {
            font-size: 13px;
            margin-bottom: 10px;
            color: #e0e0e0;
        }

        .banner-content {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .banner-content img {
            max-width: 45%;
            border-radius: 5px;
        }

        /* Auth Buttons (Masuk & Daftar) */
        .auth-buttons {
            display: flex;
            margin-top: 10px;
            gap: 5px;
        }

        .btn-masuk, .btn-daftar {
            flex: 1;
            padding: 10px;
            border: none;
            font-weight: bold;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn-masuk {
            background-color: #1b263b;
            color: #ffffff;
            border: 1px solid #1e90ff;
        }

        .btn-daftar {
            background-color: #1e90ff;
            color: #ffffff;
        }

        /* Game Categories */
        .categories {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            padding: 15px 10px;
            background-color: #0b0f19;
            text-align: center;
        }

        .category-item {
            background-color: #161f30;
            padding: 10px 5px;
            border-radius: 8px;
            font-size: 10px;
            color: #b0bec5;
            cursor: pointer;
            border: 1px solid #222e45;
        }

        .category-item span {
            display: block;
            font-size: 16px;
            margin-bottom: 4px;
        }

        /* Jackpot Section */
        .jackpot-section {
            background-color: #121622;
            margin: 10px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #2a3447;
        }

        .jackpot-title {
            color: #1e90ff;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .jackpot-display {
            background-color: #0b0f19;
            border: 2px solid #1e90ff;
            padding: 12px;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 2px;
        }

        /* Bottom Navbar */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background-color: #121622;
            padding: 10px 0;
            border-top: 1px solid #2a3447;
            position: sticky;
            bottom: 0;
        }

        .nav-item {
            text-align: center;
            color: #8a9ba8;
            font-size: 10px;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-item.active {
            color: #1e90ff;
        }

        .nav-item span {
            display: block;
            font-size: 18px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- Browser Bar -->
        <div class="browser-bar">
            <span>🔒</span>
            <div class="url-box">burnexztoto.com</div>
            <span>⋮</span>
        </div>

        <!-- Header -->
        <div class="header">
            <div class="logo">BURNEXZ<span>TOTO</span></div>
            <button class="btn-bergabung">BERGABUNG</button>
        </div>

        <!-- Banner & Auth -->
        <div class="banner">
            <div class="banner-text">Selamat datang di website resmi BURNEXZTOTO</div>
            <div class="banner-content">
                <div style="text-align: left; font-size: 11px; color: #ccc;">
                    MELAYANI DEPOSIT VIA<br>
                    <b>PULSA, E-WALLET, BANK</b><br>
                    <span style="font-size: 16px; color: #1e90ff; font-weight: bold;">MIN. DEPOSIT 10.000</span>
                </div>
                <div style="font-size: 35px;">🐉</div>
            </div>
            <div class="auth-buttons">
                <button class="btn-masuk">➔ MASUK</button>
                <button class="btn-daftar">+ DAFTAR</button>
            </div>
        </div>

        <!-- Game Categories -->
        <div class="categories">
            <div class="category-item"><span>🎲</span>TOGEL</div>
            <div class="category-item"><span>🎰</span>SLOT</div>
            <div class="category-item"><span>🎡</span>CASINO</div>
            <div class="category-item"><span>🚀</span>ARCADE</div>
            <div class="category-item"><span>⚽</span>BOLA</div>
        </div>

        <!-- Progressive Jackpot -->
        <div class="jackpot-section">
            <div class="jackpot-title">PROGRESIVE JACKPOT</div>
            <div class="jackpot-display">88.000.327,19</div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <a href="#" class="nav-item active">
                <span>🏠</span>Beranda
            </a>
            <a href="#" class="nav-item">
                <span>➕</span>Daftar
            </a>
            <a href="#" class="nav-item">
                <span>👤</span>Masuk
            </a>
            <a href="#" class="nav-item">
                <span>🏷️</span>Promo
            </a>
            <a href="#" class="nav-item">
                <span>🎧</span>Live Chat
            </a>
        </div>
    </div>

</body>
</html>
