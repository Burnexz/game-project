<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BurNexztoto Login</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-container {
            width: 320px;
            background-color: #000;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            border: 2px solid #333;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 1.6em;
            font-weight: bold;
            color: #fff;
            font-style: italic;
        }

        .live-chat-btn {
            background-color: #1a4a7b;
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 0.8em;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .live-chat-btn:hover {
             background-color: #133a61;
        }

        .welcome-text {
            text-align: center;
            color: #fff;
            font-size: 0.85em;
            margin-bottom: 20px;
        }

        .form-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 10px;
        }

        .input-group {
            background-color: #fff;
            border-radius: 20px;
            padding: 10px 15px;
        }

        .input-group input {
            background: none;
            border: none;
            width: 100%;
            outline: none;
            color: #000;
            text-align: center;
            font-size: 0.9em;
        }

        .form-links {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            margin-bottom: 20px;
        }

        .form-links a {
            color: #ccc;
            text-decoration: underline;
            cursor: pointer;
            transition: color 0.3s;
        }

        .form-links a:hover {
            color: #fff;
        }

        .login-btn {
             display: block;
             width: 100%;
             background: none;
             border: none;
             color: #fff;
             font-weight: bold;
             font-size: 1.1em;
             margin-bottom: 15px;
             cursor: pointer;
             text-align: center;
             text-decoration: none;
             transition: color 0.3s;
        }

        .login-btn:hover {
             color: #ccc;
        }

        .action-btn {
            background-color: #000;
            border: 2px solid #1a4a7b;
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.3s;
        }

        .action-btn:hover {
            background-color: #1a4a7b;
        }
        
        .action-btn .play-icon {
            background-color: #1a4a7b;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 0.6em;
            color: #fff;
        }

        .last-result {
            font-weight: bold;
            font-size: 1em;
            margin-top: 15px;
            margin-bottom: 20px;
        }

        .logos-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 30px;
        }

        .logos-grid .logo-item:last-child {
            grid-column: 2; 
        }

        .logo-item {
            background-color: #fff;
            border-radius: 5px;
            padding: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 25px;
            color: #000;
            font-weight: bold;
            font-size: 0.7em;
        }

        .logo-item .dot {
            width: 6px;
            height: 6px;
            background-color: #4CAF50;
            border-radius: 50%;
            margin-right: 5px;
        }

        .footer {
            text-align: center;
            color: #888;
            font-size: 0.7em;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="header">
            <div class="logo">BurNexztoto</div>
            <!-- Tombol Live Chat siap diisi link -->
            <a href="javascript:void(0);" class="live-chat-btn">Live Chat</a>
        </div>
        
        <div class="welcome-text">Silahkan login untuk mulai bermain</div>
        
        <form action="javascript:void(0);" method="POST" class="form-container">
            <div class="input-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            
            <div class="form-links">
                <a href="javascript:void(0);">Lite Mode</a>
                <a href="javascript:void(0);">Lupa password?</a>
            </div>
            
            <button type="submit" class="login-btn">LOG IN</button>
        </form>
        
        <!-- Tombol Daftar & Promosi -->
        <a href="javascript:void(0);" class="action-btn">
            <span>DAFTAR</span>
            <span class="play-icon">▶</span>
        </a>
        <a href="javascript:void(0);" class="action-btn">
            <span>PROMOSI</span>
            <span class="play-icon">▶</span>
        </a>
        
        <div class="last-result">Hasil Terakhir</div>
        
        <!-- Logo Bank Sesuai Permintaan -->
        <div class="logos-grid">
            <div class="logo-item"><div class="dot"></div> BCA</div>
            <div class="logo-item"><div class="dot"></div> BRI</div>
            <div class="logo-item"><div class="dot"></div> MANDIRI</div>
            <div class="logo-item"><div class="dot"></div> SEABANK</div>
            <div class="logo-item"><div class="dot"></div> DANA</div>
            <div class="logo-item"><div class="dot"></div> OVO</div>
            <div class="logo-item"><div class="dot"></div> GOPAY</div>
        </div>
        
        <div class="footer">
            © Copyright 2014 - 2026. All Rights Reserved.
        </div>
    </div>
</body>
</html>
