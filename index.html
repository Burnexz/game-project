<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BurNexztoto Login</title>
    <style>
        /* Mengatur background luar agar mirip meja/latar foto */
        body {
            background-color: #2b2b2b;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* KERANGKA HP (Membuat batasan layar seperti gambar nomor 2) */
        .phone-container {
            width: 340px;
            background-color: #000;
            border-radius: 25px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            border: 4px solid #444;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* KOTAK BIRU TUA DI BAGIAN ATAS (Header) */
        .header-box {
            background-color: #071936;
            margin: -15px -15px 15px -15px;
            padding: 20px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0b2545;
        }

        .logo {
            font-size: 1.5em;
            font-weight: bold;
            color: #fff;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        .live-chat-btn {
            background-color: #1d4ed8;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.8em;
            cursor: pointer;
            font-weight: 500;
        }

        .live-chat-btn:hover {
            background-color: #2563eb;
        }

        .welcome-text {
            text-align: center;
            color: #fff;
            font-size: 0.85em;
            margin-bottom: 20px;
        }

        .form-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 10px;
        }

        .input-group {
            background-color: #fff;
            border-radius: 25px;
            padding: 12px 15px;
        }

        .input-group input {
            background: none;
            border: none;
            width: 100%;
            outline: none;
            color: #000;
            text-align: center;
            font-size: 0.95em;
        }

        .form-links {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            margin-bottom: 20px;
            padding: 0 5px;
        }

        .form-links a {
            color: #ccc;
            text-decoration: underline;
            cursor: pointer;
        }

        .form-links a:hover {
            color: #fff;
        }

        .login-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 1em;
            letter-spacing: 1px;
        }

        .action-btn {
            background-color: #000;
            border: 2px solid #1d4ed8;
            color: #fff;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 0.9em;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-btn:hover {
            background-color: #0b2545;
        }
        
        .action-btn .play-icon {
            background-color: #1d4ed8;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 0.6em;
            color: #fff;
        }

        .last-result {
            font-weight: bold;
            font-size: 0.95em;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        /* GRID LOGO BANK */
        .logos-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 20px;
        }

        .logos-grid .logo-item:last-child {
            grid-column: 2; /* Membuat logo GoPay berada di tengah pada baris terakhir */
        }

        .logo-item {
            background-color: #fff;
            border-radius: 6px;
            padding: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 26px;
            color: #000;
            font-weight: bold;
            font-size: 0.7em;
        }

        .logo-item .dot {
            width: 6px;
            height: 6px;
            background-color: #22c55e;
            border-radius: 50%;
            margin-right: 5px;
        }

        .footer {
            text-align: center;
            color: #888;
            font-size: 0.65em;
            margin-top: auto;
            padding-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <!-- Kotak Header Biru Tua -->
        <div class="header-box">
            <div class="logo">BurNexztoto</div>
            <a href="javascript:void(0);" class="live-chat-btn">Live Chat</a>
        </div>
        
        <div class="welcome-text">Silahkan login untuk mulai bermain</div>
        
        <form action="javascript:void(0);" method="POST" class="form-container">
            <div class="input-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            
            <div class="form-links">
                <a href="javascript:void(0);">Lite Mode</a>
                <a href="javascript:void(0);">Lupa password?</a>
            </div>
        </form>
        
        <div class="login-title">LOG IN</div>
        
        <a href="javascript:void(0);" class="action-btn">
            <span>DAFTAR</span>
            <span class="play-icon">▶</span>
        </a>
        <a href="javascript:void(0);" class="action-btn">
            <span>PROMOSI</span>
            <span class="play-icon">▶</span>
        </a>
        
        <div class="last-result">Hasil Terakhir</div>
        
        <div class="logos-grid">
            <div class="logo-item"><div class="dot"></div> BCA</div>
            <div class="logo-item"><div class="dot"></div> BRI</div>
            <div class="logo-item"><div class="dot"></div> MANDIRI</div>
            <div class="logo-item"><div class="dot"></div> SEABANK</div>
            <div class="logo-item"><div class="dot"></div> DANA</div>
            <div class="logo-item"><div class="dot"></div> OVO</div>
            <div class="logo-item"><div class="dot"></div> GOPAY</div>
        </div>
        
        <div class="footer">
            © Copyright 2014 - 2026. All Rights Reserved.
        </div>
    </div>
</body>
</html>
