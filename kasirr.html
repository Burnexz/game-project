<!-- Bar Navigasi Tab -->
<div class="flex border-b border-slate-200 mb-4 text-xs font-bold">
  <button onclick="bukaTab('src')" id="btn-src" class="flex-1 py-3 text-center border-b-2 border-red-600 text-red-600">SRC Zokent</button>
  <button onclick="bukaTab('motor')" id="btn-motor" class="flex-1 py-3 text-center text-slate-500 border-b-2 border-transparent">Zokent Motor</button>
  <button onclick="bukaTab('cooling')" id="btn-cooling" class="flex-1 py-3 text-center text-slate-500 border-b-2 border-transparent">Zokent Cooling</button>
</div>

<!-- Area Konten Unit Bisnis -->
<div id="tab-src" class="block">
  <!-- Informasi & Produk SRC Zokent -->
</div>

<div id="tab-motor" class="hidden">
  <!-- Informasi & Form Booking Zokent Motor -->
</div>

<div id="tab-cooling" class="hidden">
  <!-- Informasi & Form Booking Zokent Cooling -->
</div>

<script>
  function bukaTab(namaTab) {
    // Sembunyikan semua tab
    document.getElementById('tab-src').classList.add('hidden');
    document.getElementById('tab-motor').classList.add('hidden');
    document.getElementById('tab-cooling').classList.add('hidden');
    
    // Tampilkan tab yang dipilih
    document.getElementById('tab-' + namaTab).classList.remove('hidden');
  }
</script>
