<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SYSTEM_ACCESS</title>
  <style>
    /* Mengimpor font bergaya terminal/coding */
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    :root {
      --bg-color: #050505;
      --term-green: #0f0;
      --term-dark-green: #003300;
      --alert-red: #ff003c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Share Tech Mono', monospace;
    }

    body {
      background-color: var(--bg-color);
      color: var(--term-green);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Efek garis scan TV jadul (Scanlines) */
    body::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(
        to bottom,
        rgba(18, 16, 16, 0) 50%,
        rgba(0, 0, 0, 0.25) 50%
      );
      background-size: 100% 4px;
      z-index: 50;
      pointer-events: none;
    }

    /* Efek layar berkedip halus */
    .screen-flicker {
      animation: flicker 0.15s infinite;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @keyframes flicker {
      0% { opacity: 0.95; }
      100% { opacity: 1; }
    }

    /* Kotak Login */
    .terminal-card {
      width: 400px;
      background: rgba(0, 20, 0, 0.8);
      border: 2px solid var(--term-green);
      padding: 30px;
      position: relative;
      box-shadow: 0 0 15px var(--term-dark-green), inset 0 0 20px var(--term-dark-green);
      z-index: 10;
    }

    /* Sudut-sudut kotak bergaya cyberpunk */
    .terminal-card::before,
    .terminal-card::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid var(--term-green);
    }

    .terminal-card::before {
      top: -6px; left: -6px;
      border-right: none; border-bottom: none;
    }

    .terminal-card::after {
      bottom: -6px; right: -6px;
      border-left: none; border-top: none;
    }

    /* Header */
    .header {
      margin-bottom: 30px;
      border-bottom: 1px dashed var(--term-green);
      padding-bottom: 10px;
    }

    .header h2 {
      font-size: 24px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 5px var(--term-green);
      display: flex;
      align-items: center;
    }
    
    /* Animasi kursor berkedip di judul */
    .header h2::after {
      content: '_';
      animation: blink 1s step-start infinite;
      margin-left: 5px;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .sys-msg {
      font-size: 12px;
      margin-top: 5px;
      color: rgba(0, 255, 0, 0.7);
    }

    /* Area Input */
    .input-group {
      margin-bottom: 25px;
      position: relative;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      text-transform: uppercase;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      border: 1px solid var(--term-green);
      background: #000;
      padding: 0 10px;
    }

    .prefix {
      color: var(--term-green);
      margin-right: 10px;
    }

    .input-wrapper input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--term-green);
      font-size: 16px;
      padding: 12px 0;
      text-shadow: 0 0 2px var(--term-green);
    }

    .input-wrapper input::placeholder {
      color: rgba(0, 255, 0, 0.3);
    }

    /* Saat input fokus */
    .input-wrapper:focus-within {
      background: var(--term-dark-green);
      box-shadow: 0 0 8px var(--term-green);
    }

    /* Tombol Execute */
    .btn-execute {
      width: 100%;
      background: transparent;
      color: var(--term-green);
      border: 1px solid var(--term-green);
      padding: 15px;
      font-size: 18px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 2px;
      position: relative;
      overflow: hidden;
    }

    .btn-execute:hover {
      background: var(--term-green);
      color: #000;
      box-shadow: 0 0 15px var(--term-green);
      font-weight: bold;
    }

    /* Efek error (opsional jika salah sandi) */
    .error-msg {
      color: var(--alert-red);
      font-size: 12px;
      margin-top: 10px;
      display: none;
      text-shadow: 0 0 5px var(--alert-red);
    }
  </style>
</head>
<body>

  <div class="screen-flicker">
    <div class="terminal-card">
      <div class="header">
        <h2>AUTH_REQUIRED</h2>
        <p class="sys-msg">ESTABLISHING SECURE CONNECTION...</p>
      </div>

      <form onsubmit="return false;">
        <!-- Input ID / Telepon -->
        <div class="input-group">
          <label>> IDENTIFICATION_ID</label>
          <div class="input-wrapper">
            <span class="prefix">USER:</span>
            <input type="text" placeholder="Enter ID or Phone Number" autocomplete="off" required>
          </div>
        </div>

        <!-- Input Password -->
        <div class="input-group">
          <label>> ACCESS_KEY</label>
          <div class="input-wrapper">
            <span class="prefix">PASS:</span>
            <input type="password" placeholder="Enter Security Key" autocomplete="off" required>
          </div>
          <!-- Pesan error disembunyikan secara default -->
          <p class="error-msg" id="errorMsg">ACCESS DENIED. INVALID CREDENTIALS.</p>
        </div>

        <!-- Tombol Execute -->
        <button type="submit" class="btn-execute" onclick="checkLogin()">
          [ EXECUTE ]
        </button>
      </form>
    </div>
  </div>

  <script>
    // Contoh script sederhana untuk menampilkan efek error
    function checkLogin() {
      const btn = document.querySelector('.btn-execute');
      btn.innerText = "VERIFYING...";
      
      setTimeout(() => {
        // Simulasi error untuk efek hacker
        document.getElementById('errorMsg').style.display = 'block';
        btn.innerText = "[ EXECUTE ]";
        
        // Mengembalikan warna normal setelah 2 detik
        setTimeout(() => {
           document.getElementById('errorMsg').style.display = 'none';
        }, 2000);
      }, 800);
    }
  </script>

</body>
</html>
