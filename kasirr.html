<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Kasir - Nuansa Hijau</title>
  <style>
    :root {
      --bg-dark: #05130b;
      --primary-green: #10b981;
      --accent-green: #059669;
      --glow-green: rgba(16, 185, 129, 0.4);
      --glass-bg: rgba(6, 32, 20, 0.5);
      --glass-border: rgba(52, 211, 153, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(16, 185, 129, 0.15), transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(5, 150, 105, 0.1), transparent 50%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Efek garis cyber background */
    body::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 40px,
        rgba(16, 185, 129, 0.03) 40px,
        rgba(16, 185, 129, 0.03) 80px
      );
      pointer-events: none;
    }

    /* Container Kartu Glassmorphism */
    .login-card {
      width: 360px;
      padding: 35px 28px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.6),
        inset 0 0 15px rgba(16, 185, 129, 0.1),
        0 0 25px var(--glow-green);
      position: relative;
      z-index: 10;
    }

    /* Header Form */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .card-header h2 {
      color: #ffffff;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .card-header a {
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-size: 15px;
      transition: color 0.3s;
    }

    .card-header a:hover {
      color: #6ee7b7;
    }

    /* Input Field Group */
    .input-group {
      position: relative;
      margin-bottom: 20px;
      background: rgba(1, 22, 12, 0.6);
      border: 1px solid rgba(52, 211, 153, 0.25);
      border-radius: 12px;
      display: flex;
      align-items: center;
      padding: 0 15px;
      height: 52px;
      transition: all 0.3s ease;
    }

    .input-group:focus-within {
      border-color: var(--primary-green);
      box-shadow: 0 0 12px var(--glow-green);
    }

    .input-icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #6ee7b7;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin-right: 10px;
      flex-shrink: 0;
    }

    .prefix {
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
      padding-right: 10px;
      border-right: 1px solid rgba(255, 255, 255, 0.2);
      margin-right: 10px;
    }

    .input-group input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 14px;
    }

    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    .eye-icon {
      cursor: pointer;
      stroke: rgba(255, 255, 255, 0.5);
      transition: stroke 0.3s;
    }

    .eye-icon:hover {
      stroke: #ffffff;
    }

    /* Tombol Masuk */
    .btn-submit {
      width: 100%;
      height: 50px;
      margin-top: 10px;
      background: linear-gradient(135deg, #10b981 0%, #047857 100%);
      border: 1px solid rgba(110, 231, 183, 0.5);
      border-radius: 12px;
      color: #ffffff;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
      transition: all 0.3s ease;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
      background: linear-gradient(135deg, #34d399 0%, #059669 100%);
    }

    .btn-submit:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="card-header">
      <h2>Masuk</h2>
      <a href="#">Daftar &rsaquo;</a>
    </div>

    <form onsubmit="return false;">
      <div class="input-group">
        <svg class="input-icon" viewBox="0 0 24 24">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
        </svg>
        <span class="prefix">+62</span>
        <input type="tel" placeholder="Masukkan nomor Telepon" required>
      </div>

      <div class="input-group">
        <svg class="input-icon" viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <input type="password" id="passwordInput" placeholder="Masukkan sandi" required>
        
        <svg class="input-icon eye-icon" id="eyeIcon" viewBox="0 0 24 24" onclick="togglePassword()">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </div>

      <button type="submit" class="btn-submit">
        Masuk <span>&rsaquo;</span>
      </button>
    </form>
  </div>

  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('passwordInput');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
      } else {
        passwordInput.type = 'password';
      }
    }
  </script>

</body>
</html>
